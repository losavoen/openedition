<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Edition (miami art week)</title>
<meta name="description" content="December 4–7, 2026. Password in the group chat.">
<meta property="og:title" content="Open Edition (miami art week)">
<meta property="og:description" content="December 4–7, 2026. Password in the group chat.">
<meta property="og:image" content="/assets/og.jpg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400&family=Cutive+Mono&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Aspekta';src:url('/assets/fonts/Aspekta-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Aspekta';src:url('/assets/fonts/Aspekta-550.woff2') format('woff2');font-weight:550;font-display:swap}
:root{--ink:#1C1C1A;--muted:#76736F;--rose:#B0456C;--ease:cubic-bezier(.2,.7,0,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#FFFFFF;color:var(--ink);font-family:'Aspekta',Helvetica,Arial,sans-serif}
.mono{font-family:'Azeret Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.06em;text-transform:uppercase}
.page{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:22px 27px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:40px 0}
.pola{width:min(220px,52vw);background:#FFFFFF;padding:9px 9px 16px;box-shadow:0 14px 34px rgba(28,28,26,0.12);transform:rotate(-2.5deg);transition:transform 0.9s var(--ease),box-shadow 0.9s var(--ease);display:flex;flex-direction:column;gap:12px}
.pola:hover{transform:rotate(0deg) translateY(-6px);box-shadow:0 24px 50px rgba(28,28,26,0.18)}
.pola .ph{display:block;aspect-ratio:4/5;overflow:hidden;background:#EEE}
.pola img{display:block;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.04);transition:filter 0.9s var(--ease),transform 1.2s var(--ease)}
.pola:hover img{filter:none;transform:scale(1.04)}
.pola p{margin:0;display:flex;justify-content:space-between}
.title{text-align:center;display:flex;flex-direction:column;gap:6px}
.title b{font-weight:550;font-size:15px;letter-spacing:-0.01em;text-transform:uppercase}
.title i{font-style:normal;font-family:'Cutive Mono','Azeret Mono',monospace;font-size:14px}
form{display:flex;align-items:center;gap:10px;width:min(260px,80vw);border-bottom:1px solid var(--ink);transition:border-color 0.4s var(--ease)}
form:focus-within{border-color:var(--rose)}
input{flex:1;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;padding:10px 0;outline:none;min-width:0}
input::placeholder{color:var(--muted)}
button{background:none;border:0;padding:8px 0 8px 8px;font:inherit;font-size:18px;color:var(--ink);cursor:pointer;transition:transform 0.4s var(--ease)}
button:hover{transform:translateX(3px)}
.err{min-height:14px;color:var(--rose)}
.fade{animation:up 1.1s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pola.fade{animation-name:deal}
@keyframes deal{from{opacity:0;transform:rotate(-8deg) translateY(24px)}to{opacity:1;transform:rotate(-2.5deg)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
@media (max-width:600px){.page{padding:16px}}
</style>
</head>
<body>
<div class="page">
<div class="row mono"><span>Miami, FL</span><span>Password in the group chat</span></div>
<main class="mid">
<div class="pola fade"><span class="ph"><img src="/assets/og.jpg" alt=""></span><p class="mono"><span>No. 01</span><span>Miami</span></p></div>
<div class="title fade" style="animation-delay:0.15s"><b>Open Edition</b><i>(miami art week)</i></div>
<form class="fade" style="animation-delay:0.25s" method="post" action="/api/login">
<input type="hidden" name="next" id="next" value="/">
<input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required autofocus>
<button type="submit" aria-label="Enter">→</button>
</form>
<p class="mono err" id="err" role="alert"></p>
</main>
<div class="row mono"><span>December 4–7, 2026</span><span>By invitation</span></div>
</div>
<script>
(function(){var q=new URLSearchParams(location.search);var n=q.get('next');if(n&&n.charAt(0)==='/'&&n.charAt(1)!=='/')document.getElementById('next').value=n;if(q.get('e'))document.getElementById('err').textContent='Not quite. Try again.';})();
</script>
</body>
</html>
